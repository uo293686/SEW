<main>
    
    <h2>Circuito de MotoGP-Desktop: Autodromo Internazionale del Mugello</h2>

    <h3>Introduzca los datos del circuito:</h3>
    <label for="html">Selecciona el archivo html:</label>
    <input type="file" accept=".html" id = "html"> 
    <button>Cargar HTML</button>

    <h3>Introduzca altimetría:</h3>
    <label for="svg">Selecciona el archivo svg de altimetría:</label>
    <input type="file" accept=".svg" id = "svg">
    <button>Cargar SVG</button>


    <h3>Introduzca kml:</h3>
    <label for="kml">Selecciona el archivo kml para insertar en el mapa:</label>
    <input type="file" accept=".kml" id="kml">
    <button>Cargar KML</button>
    
    <div></div>
    <script>
        mapboxgl.accessToken = 'pk.eyJ1IjoidW8yOTM2ODYiLCJhIjoiY21pdWptdzVnMDBlYjNmczczdnVzb2N3NCJ9.Lb_ViQNxiTIX63b4HdcSzg';
        const contenedorMapa = document.querySelector("main > div:last-of-type");

        const mapa = new mapboxgl.Map({
            container: contenedorMapa,
            style: 'mapbox://styles/mapbox/streets-v11',
            center: [11.3714, 43.9976], 
            zoom: 12
        });
        mapa.on('load', () => {
            mapa.resize();
        });
        const cargadorKML = new CargadorKML(mapa);

        $("input[accept='.kml']").next("button").click(function () {
            const file = $("input[accept='.kml']")[0].files[0];
            if (file) cargadorKML.leerArchivoKML(file);
        });
    </script>

    <script>
    $(document).ready(function() {
        const circuito = new Circuito();
        const cargadorSVG = new CargadorSVG();
        
        $("input[accept='.html']").next("button").click(function() {
            const file = $("input[accept='.html']")[0].files[0];
            if (file) circuito.rellenaDOM(file);
        });
        
        $("input[accept='.svg']").next("button").click(function() {
            const file = $("input[accept='.svg']")[0].files[0];
            if (file) cargadorSVG.insertarSVG(file);
        });
    });
    </script>
</main>
