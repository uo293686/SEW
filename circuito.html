<main>

    <h2>Circuito de MotoGP-Desktop</h2>
    <h3>Info del circuito</h3>
    <input type="file" accept=".html">

    
    <h3>Altimetría del circuito:</h3>
    <input type="file" accept=".svg"/>
    <section></section>

    <h3>Mapa dinámico del circuito</h3>
    <input type="file" accept=".xml,.kml">
    <button>Insertar circuito en mapa</button>
    <div></div>



    <script>
        const inputs = document.querySelectorAll("input[type='file']");
        const inputFileHtml = inputs[0];
        const inputFileSVG = inputs[1];
        const inputFileKML = inputs[2];

        const contenedor = document.querySelector("section");
        const boton = document.querySelector("button");

        const circuito = new Circuito();
        if (circuito.comprobarAPIFile()) {
        inputFileHtml.addEventListener("change", (e) => {
            const file = e.target.files[0];
            if (file) {
            circuito.rellenaDOM(file);
            }
        });
        }

        const cargador = new CargadorSVG();
        inputFileSVG.addEventListener("change", (e) => {
        const file = e.target.files[0];
        if (file) {
            cargador.insertarSVG(file);
        }
        });

        mapboxgl.accessToken = "";
        const map = new mapboxgl.Map({
        container: document.querySelector("div"),
        style: "mapbox://styles/mapbox/streets-v12",
        center: [11.3714, 43.9976],
        zoom: 13
        });

        boton.addEventListener("click", () => {
        CargadorKML.insertarCapaKML(map);
        });
    </script>

</main>
